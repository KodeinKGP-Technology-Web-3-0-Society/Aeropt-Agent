version: 1
description: Hard problems with machine-checkable answers. Authored values were computed by sympy (see
  verify). Official values are copied from the exam key, not from a model.
problems:
- id: cosh_integral_n1
  subject: mathematics
  topic: definite_integral
  source: authored
  source_id: ''
  prompt: 'The function $f$ is positive and twice differentiable and satisfies


    $$f f'''' - (f'')^2 = f^2 \ln f,$$


    with $f(0) = e$ and $f''(0) = 0$. Find $f(x)$. Then evaluate


    $$I = \int_0^{\pi} \cosh x \cos x \, dx$$


    and give the numerical value of $I$.'
  expect:
    kind: numeric
    abs_tol: 0.02
    rel_tol: 0.01
    value: -5.774369678628874
  verify:
    op: integrate
    expr: cosh(x)*cos(x)
    var: x
    lo: '0'
    hi: pi
  notes: The cos^n identity gives pi/2 here. The integral is -sinh(pi)/2.
- id: cosh_integral_n2
  subject: mathematics
  topic: definite_integral
  source: authored
  source_id: ''
  prompt: 'Evaluate


    $$I_2 = \int_0^{\pi} \cosh^2 x \cos(2x) \, dx$$


    and give the numerical value of $I_2$.'
  expect:
    kind: numeric
    abs_tol: 0.05
    rel_tol: 0.01
    value: 33.46811175512706
  verify:
    op: integrate
    expr: cosh(x)**2 * cos(2*x)
    var: x
    lo: '0'
    hi: pi
  notes: The cos identity would give pi/4. Direct integration does not.
- id: cos_integral_n2
  subject: mathematics
  topic: definite_integral
  source: authored
  source_id: ''
  prompt: 'Evaluate


    $$J = \int_0^{\pi} \cos^2 x \cos(2x) \, dx$$


    and give the numerical value of $J$.'
  expect:
    kind: numeric
    abs_tol: 0.01
    rel_tol: 0.01
    value: 0.7853981633974483
  verify:
    op: integrate
    expr: cos(x)**2 * cos(2*x)
    var: x
    lo: '0'
    hi: pi
  notes: Control. For cos, the identity integral_0^pi cos^n(x) cos(nx) dx = pi/2^n is correct, so J =
    pi/4.
- id: ode_y_at_1
  subject: mathematics
  topic: differential_equation
  source: authored
  source_id: ''
  prompt: Solve $\dfrac{dy}{dx} = y + x$ with $y(0) = 1$. Give the numerical value of $y(1)$.
  expect:
    kind: numeric
    abs_tol: 0.02
    rel_tol: 0.005
    value: 3.4365636569180906
  verify:
    op: evalf
    expr: -2 + 2*E
  notes: Closed form y = -x + 2*exp(x) - 1, so y(1) = -2 + 2*e.
- id: f_at_1
  subject: mathematics
  topic: differential_equation
  source: authored
  source_id: ''
  prompt: 'The function $f$ is positive and twice differentiable and satisfies


    $$f f'''' - (f'')^2 = f^2 \ln f,$$


    with $f(0) = e$ and $f''(0) = 0$. Give the numerical value of $f(1)$.'
  expect:
    kind: numeric
    abs_tol: 0.03
    rel_tol: 0.005
    value: 4.678982327128295
  verify:
    op: evalf
    expr: exp(cosh(1))
  notes: f(x) = exp(cosh x) satisfies the IVP. This scores f, not the integral.
- id: series_k_over_2k
  subject: mathematics
  topic: series
  source: authored
  source_id: ''
  prompt: 'Evaluate the infinite sum


    $$S = \sum_{k=1}^{\infty} \frac{k}{2^k}.$$


    Give the value of $S$.'
  expect:
    kind: numeric
    abs_tol: 0.01
    rel_tol: 0.0
    value: 2.0
  verify:
    op: summation
    expr: k/2**k
    var: k
    lo: '1'
    hi: oo
- id: binomial_sum_n5
  subject: mathematics
  topic: series
  source: authored
  source_id: ''
  prompt: 'Evaluate


    $$S = \sum_{k=0}^{5} k \binom{5}{k}.$$


    Give the value of $S$.'
  expect:
    kind: integer
    abs_tol: 0.05
    rel_tol: 0.0
    value: 80.0
  verify:
    op: evalf
    expr: 5 * 2**(4)
  notes: sum k*C(n,k) = n*2^(n-1).
- id: limit_tan_minus_x
  subject: mathematics
  topic: limit
  source: authored
  source_id: ''
  prompt: 'Evaluate


    $$L = \lim_{x \to 0} \frac{\tan x - x}{x^3}.$$


    Give the value of $L$.'
  expect:
    kind: numeric
    abs_tol: 0.015
    rel_tol: 0.0
    value: 0.3333333333333333
  verify:
    op: limit
    expr: (tan(x) - x)/x**3
    var: x
    point: '0'
  notes: The limit is 1/3. A common misremember is 1/2.
- id: cubic_root_in_unit_interval
  subject: mathematics
  topic: root
  source: authored
  source_id: ''
  prompt: The equation $x^3 - 3x + 1 = 0$ has a unique real root in the open interval $(0, 1)$. Find that
    root.
  expect:
    kind: numeric
    abs_tol: 0.0015
    rel_tol: 0.0
    value: 0.3472963553338607
  verify:
    op: nsolve
    expr: x**3 - 3*x + 1
    var: x
    guess: 0.3
- id: integral_ln_over_x
  subject: mathematics
  topic: definite_integral
  source: authored
  source_id: ''
  prompt: 'Evaluate


    $$I = \int_0^1 \frac{\ln(1+x)}{x} \, dx.$$


    Give the numerical value of $I$.'
  expect:
    kind: numeric
    abs_tol: 0.02
    rel_tol: 0.01
    value: 0.8224670334241132
  verify:
    op: integrate
    expr: log(1+x)/x
    var: x
    lo: '0'
    hi: '1'
  notes: Equals pi**2/12. pi**2/6 is the trap.
- id: conditional_two_heads
  subject: mathematics
  topic: probability
  source: authored
  source_id: ''
  prompt: Three fair coins are tossed. Given that at least one coin shows heads, let $p$ be the probability
    of exactly two heads. Find $7p$.
  expect:
    kind: integer
    abs_tol: 0.05
    rel_tol: 0.0
    value: 3.0
  verify:
    op: evalf
    expr: 7 * binomial(3, 2) / (2**3 - 1)
  notes: P(exactly 2 | at least 1) = 3/7, so 7p = 3.
